# The tavern bundle patch: the world-card engine over the dsh web surface.
# Applied after dsh-base and dsh-web-app; the profile's own cordis.patch.yml
# and any --patch overlays still to come. A patch replaces the targeted row's
# whole `config`, so each row below restates every key it owns.

- insert:
    # Host engine: workspaces, card prompts, runtime tools, tail scheduling.
    - id: tavern-engine
      name: 'dsh-tavern-fengyue-engine'

    # Remote owner over the engine (ctx.remote.tavern namespace).
    - id: tavern-api
      name: 'dsh-tavern-fengyue-api'

    # Browser half: the tavern takeover (session list, library, opening,
    # save/load/clear header actions).
    - id: ui-tavern
      name: 'dsh-tavern-fengyue-ui'

# Session titles are not part of the game loop yet; the first-prompt title
# generator would fire a second model request per session (request #2 in the
# mock log). Re-enable by removing this patch row.
- id: session-title-llm
  disabled: true

# The card IS the whole world: main and tail agents run on the `empty`
# preset (zero child plugins — no persona, no tools; the card's own system
# prompt and tool face stand alone), while the card-writing agent runs on
# `standard` so it keeps the full product tool face (fs read/write, shell,
# web, todo). The preset-selection UI row stays out of the tavern composition
# entirely. In 0.1.7 a preset is a `@deepseek-ai/dsh-agent-preset` SERVICE row
# (one per preset: config.id + config.plugins) declared directly in the patch;
# `standard` ships with the web-app base.
- id: ui-agent-preset
  disabled: true

- insert:
    - id: preset-empty
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: empty
        description: 不挂载任何工具与 persona 的空白 Agent（酒馆主/尾代理专用，卡片自带全部系统提示词与工具）
        order: 9
        plugins: []

# The tavern serves on its own port. `dsh web` and the tavern profile are two
# profiles that can perfectly well run side by side, and 3080 is the web-app
# layer's default that `dsh web` takes; leaving it shared means the second one
# to start dies on EADDRINUSE. `--port` still wins (an explicit CLI flag reaches
# ctx.webStartup.port), so this only changes the fallback. The row's whole
# `config` is restated because a patch replaces all of it, not one key.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject:
    - webStartup
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3081
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
