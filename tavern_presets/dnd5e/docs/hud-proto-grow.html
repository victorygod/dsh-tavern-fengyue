  册=bk-h（66px 头像+HP/EXP 册头列+钱袋）→ bk-body【小传置顶】→ bk-cols（左：雷达/豁免/技能·仅熟练；右：速览/状态/施法/装备/特征/训练/抗免）。
  本轮提议的成长流（2026-09-24 用户定案）：
  ① 提醒非按钮：主卡状态行待办 chip 保留 2.2s 呼吸发光（pp），改文案「◆未分配成长·N」、去 data-act——
     点卡整体的 data-act=book 行为不变，分配在详细面板里做。
  ② 加点位子贴雷达：ASI 待分时「六维」节标题带呼吸点+进度，雷达下方出 3×2 属性 chip（点一下 +1，预览现值→目标值；
     恰 2 点才可落档，+2 的项再点撤销，✕ 清零）——落档前左栏雷达实时预览形状。
  ③ 学法术贴法术栏：新法术待学时「施法」节标题带呼吸点，已知/已备行下出候选清单——
     候选=泵层机械生成（本职业表 ∩ 环位≤当前可施 ∩ 未收录，戏法排除；原型内嵌 mock），
     行=中文名+环徽+仪式徽，点行选/再点撤，恰 2 个才可落档。无输入框、零杜撰。
  ④ 一档一落：落档销一条 pending、余档自动续；全部销完→呼吸点消失、两节回归现状零差异。
  数据注记：提交为前端模拟（交付版走 runScript('front_commit.mjs') + 泵 refresh，现值回落=C1 语义）；
  候选 mock 按法师 LV4（可施 1~2 环）裁取 SRD 常见环术作演示。

<script>
/* ═════ 中英映射（照 view.mjs 移植子集）═════ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const CLS_CN = { wizard: '法师', cleric: '牧师', fighter: '战士' }
const RACE_CN = { human: '人类', half_elf: '半精灵', dwarf: '矮人' }
const SKILL_CN = { arcana: '奥秘', history: '历史', investigation: '调查', insight: '洞悉', religion: '宗教', medicine: '医药', athletics: '运动', intimidation: '威吓', survival: '生存' }
const WEAPON_CN = { quarterstaff: '长杖', dagger: '匕首', mace: '硬头锤', shortbow: '短弓', warhammer: '战锤', handaxe: '手斧' }
const DMG_CN = { bludgeoning: '钝击', piercing: '穿刺', slashing: '挥砍' }
const PROP_CN = { finesse: '灵巧', light: '轻型', thrown: '投掷', versatile: '多用', ranged: '远程', ammunition: '弹药' }
const ARMOR_CN = { scale_mail: '鳞甲', chain_mail: '锁甲' }
const ATTRS = [['力', 'str'], ['敏', 'dex'], ['体', 'con'], ['智', 'int'], ['感', 'wis'], ['魅', 'cha']]
const sign = v => (v >= 0 ? '+' : '−') + Math.abs(v)
const mod = v => Math.floor((v - 10) / 2)
const pb = lv => 2 + Math.floor((Math.min(Math.max(lv, 1), 20) - 1) / 4)
const GENDER_META = { male: { glyph: '♂', cls: 'gm' }, female: { glyph: '♀', cls: 'gf' }, unknown: { glyph: null, cls: 'go' } }
const val = v => v == null ? '???' : v

/* 泵 derived（交付版=ui_data.mjs；原型照语义现算，growASI=未落档加点的并入预览） */
function derive(c, growASI = {}) {
  const lv = Math.min(Math.max(c.level ?? 1, 1), 20), P = pb(lv)
  const dv = key => (c[key] ?? null)
  const attrMods = ATTRS.map(([, key]) => { const v = dv(key); return { key, mod: v == null ? null : mod(v) + (growASI[key] || 0) } })
  const skills = (c.skill_prof ?? []).map(key => {
    const s = SKILL_CN[key] ?? key
    const attr = ({ arcana: 'int', history: 'int', investigation: 'int', insight: 'wis', religion: 'int', medicine: 'wis', athletics: 'str', intimidation: 'cha', survival: 'wis' })[key]
    return { key, attr, mod: mod(dv(attr) ?? 10) + P }
  })
  const saves = (c.save_prof ?? []).map(key => ({ key, mod: mod(dv(key) ?? 10) + P }))
  const caster = c.caster_attr != null
  const T = { 1: [2], 2: [3], 3: [4, 2], 4: [4, 3], 5: [4, 3, 2] }[lv] ?? [4, 3, 3, 3, 2]
  const slotsLv = caster ? T.map((total, i) => ({ lv: i + 1, now: c['slots_l' + (i + 1)] ?? total, total })).filter(s => s.total > 0) : []
  return {
    hpPct: (c.hp != null && c.hp_max) ? Math.round((c.hp / c.hp_max) * 100) : null,
    attrMods, skills, saves, slotsLv,
    dc: caster ? 8 + P + mod(dv(c.caster_attr) ?? 10) : null,
    atk: caster ? P + mod(dv(c.caster_attr) ?? 10) : null,
    passive: 10 + mod(dv('wis') ?? 10),
    expBar: c.exp != null ? { exp: c.exp, min: c.expMin, next: c.expNext } : null,
  }
}

/* 候选清单 mock——交付版=泵层生成：本职业表 ∩ 环位≤当前可施 ∩ 未收录 ∩ 非戏法（SRD「Learning Spells of 1st Level and Higher」限制） */

  { n: '蛛网术', lv: 2 }, { n: '迷雾步', lv: 2 }, { n: '锁定术', lv: 2 }, { n: '识破隐形', lv: 2 }, { n: '软化大地', lv: 2 },

/* ═════ 渲染（照 view.mjs 语句移植；g-* = 本轮新增）═════ */
const chipsSmall = st => (st ?? []).map(x => `<span class="stc ${esc(x.kind ?? 'i')}"><span class="k">${esc(x.name)}</span>${esc(x.remaining ?? '')}</span>`).join('')
const avatarFor = (c, avatars) => `<span class="pix-letter" style="font-size:${c._who === 'player' ? '24px' : '18px'}">${esc((c.name ?? '?')[0] ?? '?')}</span>`   // 原型统一首字兜底（图槽契约沿实现）
const genderOf = c => GENDER_META[c.gender] ?? GENDER_META.unknown

/* ── 主角卡：唯一差异=待办 chip 文案与去按钮化（pp 呼吸照现行）── */
function heroCard(p, avatars) {
  const g = genderOf(p)
  const d = p.derived ?? {}
  const unk = d.hpPct == null
  const hpP = unk ? 100 : d.hpPct
  const tw = (p.temp_hp && p.hp_max) ? Math.min((p.temp_hp / p.hp_max) * 100, 100 - hpP) : 0
  const xb = d.expBar
  return `
    <div class="h-card" data-who="player">
      <div class="row1">
        <div class="h-av ${g.cls}">${avatarFor(p, avatars)}<span class="h-lv">LV${esc(p.level ?? '???')}</span></div>
        <div class="h-names">
          <div class="h-nm">${esc(p.name ?? '')}</div>
          <div class="h-tags">
            <span class="h-tag">${esc(RACE_CN[p.race] ?? p.race ?? '')}</span>
            ${g.glyph ? `<span class="g-glyph ${g.cls}">${g.glyph}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="h-hp">
        <div class="hpbar" title="HP ${esc(hpText(p))}">
          <div class="fill" style="width:${hpP}%"></div>
          ${tw ? `<div class="tmp" style="width:${tw}%; left:${hpP}%"></div>` : ''}
          <div class="cap"><span class="lb">HP</span><span class="nn">${esc(hpText(p))}</span></div>
        </div>
      </div>
      ${xb ? `<div class="h-exp" title="EXP ${esc(xb.exp)} / 升至 LV${esc((p.level ?? 0) + 1)} 需 ${esc(xb.next)}"><div class="bar"><div class="fill" style="width:${Math.round(((xb.exp - xb.min) / Math.max(1, xb.next - xb.min)) * 100)}%"></div></div><span class="lb">EXP ${esc(xb.exp)}/${esc(xb.next)}</span></div>` : ''}
      <div class="h-status">${chipsSmall(p.statuses)}${(p.pending ?? []).length ? `<span class="stc i pending" title="存在未分配的成长项（属性点/新法术）——点卡打开数据册分配，也可暂置不理"><span class="k">◆</span>未分配成长${(p.pending ?? []).length > 1 ? '·' + p.pending.length : ''}</span>` : ''}</div>
    </div>`
}

/* ── 雷达（照 view.mjs radarSvg：RR=66、底轴内收、缺席轴收束；值=预览值）── */
function radarSvg(c, d) {
  const CX = 100, CY = 95, RR = 66
  const a = i => -Math.PI / 2 + i * Math.PI / 3
  const pt = (i, r) => [CX + r * Math.cos(a(i)), CY + r * Math.sin(a(i))]
  const ring = fr => ATTRS.map((_, i) => { const [x, y] = pt(i, RR * fr); return `${x.toFixed(1)},${y.toFixed(1)}` }).join(' ')
  const poly = ATTRS.map(([, key]) => {
    const i = ATTRS.findIndex(x => x[1] === key)
    const m = (d?.attrMods ?? []).find(x => x.key === key)?.mod
    const t = m == null ? null : Math.max(0, Math.min(1, (m + 5) / 10))
    const [x, y] = pt(i, t == null ? 0 : RR * (0.25 + 0.75 * t))
    return `${x.toFixed(1)},${y.toFixed(1)}`
  }).join(' ')
  const labels = ATTRS.map(([lb, key], i) => {
    const drop = i === 3 ? -5 : 4
    const [x, y0] = pt(i, RR + 17)
    const y = y0 + drop
    const anchor = Math.abs(x - CX) < 8 ? 'middle' : x < CX ? 'end' : 'start'
    const m = (d?.attrMods ?? []).find(x2 => x2.key === key)?.mod
    return `<text class="rl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${lb}</text>`
      + `<text x="${x.toFixed(1)}" y="${(y + 15).toFixed(1)}" text-anchor="${anchor}"><tspan class="rv">${esc(c[key] ?? '???')}</tspan><tspan class="rm">${m == null ? '' : ' ' + sign(m)}</tspan></text>`
  }).join('')
  return `<svg class="bk-radar" viewBox="0 0 200 190" role="img" aria-label="六维属性">`
    + [1 / 3, 2 / 3, 1].map(fr => `<polygon class="ring" points="${ring(fr)}"/>`).join('')
    + ATTRS.map((_, i) => { const [x, y] = pt(i, RR); return `<line class="axis" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>` }).join('')
    + `<polygon class="poly" points="${poly}"/>` + labels + `</svg>`
}

const hpText = c => `${val(c.hp)}${c.temp_hp > 0 ? '+' + c.temp_hp : ''}/${val(c.hp_max)}`

/* ── 成长界面件（本轮核心）── */
/* 加点：六维雷达下方 3×2 chip；恰 2 点可落档；预览并入雷达 */
function asiZone(c) {
  const selTiers = (c.pending ?? []).filter(x => String(x).includes('ASI')).length
  if (!selTiers) return { capAdd: '', zone: '' }
  const sel = Object.values(GROW.asi).reduce((a, b) => a + b, 0)
  const chips = ATTRS.map(([lb, key]) => {
    const n = GROW.asi[key] ?? 0
    const v = c[key] ?? 10
    const capped = sel >= 2 && n === 0
    return `<button class="g-att ${n ? 'sel' : ''} ${capped ? 'cap' : ''}" data-stat="${key}" title="${n === 2 ? '再点撤销' : '加 1 点'}">
      <b>${lb}</b><span class="vv">${v}${n ? `<span class="to">→${v + n}</span>` : ''}</span><span class="go">${n === 2 ? '↺' : '＋'}</span></button>`
  }).join('')
  const zone = `<div class="g-asi">${chips}</div>
    <div class="g-asi-foot">
      <span class="g-hint">RAW +2 单项 / +1×2 · 上限 20</span>
      ${sel ? `<button class="g-clear" data-clear="asi">✕清零</button>` : ''}
      <button class="g-btn" data-op="asi" ${sel === 2 ? '' : 'disabled'}>落档${selTiers > 1 ? `·余${selTiers - 1}档` : ''}</button>
    </div>`
  return { capAdd: `<span class="gdot"></span>六维 · 本档 ${sel}/2 点`, zone }
}
/* 学法术：施法节内候选清单；恰 2 个可落档；选中行金绿高亮 */
function pickZone(c) {
  const spTiers = (c.pending ?? []).filter(x => String(x).includes('新法术')).length
  if (!spTiers) return { capAdd: '', zone: '' }
  const rows = CANDS.map(s => {
    const sel = GROW.spells.includes(s.n)
    const capped = GROW.spells.length >= 2 && !sel
    return `<button class="gp-row ${sel ? 'sel' : ''} ${capped ? 'cap' : ''}" data-spell="${esc(s.n)}">
      <span class="nm">${esc(s.n)}</span>${s.ritual ? '<span class="rt">仪式</span>' : ''}<span class="lv2">${s.lv}环</span><span class="pk">${sel ? '✓' : '＋'}</span></button>`
  }).join('')
  const zone = `<div class="g-pick">
      <div class="gp-cap">可学候选——本职业表 ∩ 环位≤可施 ∩ 未收录（泵层生成，禁止杜撰）</div>
      <div class="gp-list">${rows}</div>
      <div class="gp-done">
        <span class="g-hint">已选 ${GROW.spells.length}/2 · 学不满可收册悬置</span>
        <button class="g-btn" data-op="spells" ${GROW.spells.length === 2 ? '' : 'disabled'}>落档${spTiers > 1 ? `·余${spTiers - 1}档` : ''}</button>
      </div>
    </div>`
  return { capAdd: `<span class="gdot"></span>施法 · 新法术 ${GROW.spells.length}/2`, zone }
}

/* ── 数据册（照 view.mjs bookHtml 结构：小传置顶 → bk-cols 左[六维(+加点)/豁免/技能] 右[速览/状态/施法(+候选)/装备/特征/训练/抗免]）── */
function bookHtml(c, cBase) {
  const g = genderOf(c)
  const d = c.derived ?? {}
  const unk = d.hpPct == null
  const hpP = unk ? 100 : d.hpPct
  const grow = c._who === 'player'
  const asi = grow ? asiZone(cBase ?? c) : { capAdd: '', zone: '' }
  const pick = grow ? pickZone(c) : { capAdd: '', zone: '' }
  const head = `
    <div class="bk-h">
      <div class="bk-av ${g.cls}">${avatarFor(c)}</div>
      <div class="bk-hd">
        <div class="bk-nm">${esc(c.name ?? '')}</div>
        <div class="bk-sub">LV${esc(c.level ?? '???')} ${esc(CLS_CN[c.class] ?? c.class ?? '')}·${esc(RACE_CN[c.race] ?? c.race ?? '')}${g.glyph ? `<span class="bk-g ${g.cls}">${g.glyph}</span>` : ''}</div>
        <div class="bk-sub2">${c.background ? esc(c.background) : ''}${c.background && c.persona?.alignment ? ' · ' : ''}${c.persona?.alignment ? esc(c.persona.alignment) : ''}</div>
      </div>
      <div class="bk-hp">
        <div class="hph" title="HP ${esc(hpText(c))}">
          <div class="fill" style="width:${hpP}%"></div>
          <div class="cap"><span class="lb">HP</span><span class="nn">${esc(hpText(c))}</span></div>
        </div>
        ${d.expBar ? `<div class="bke" title="EXP ${esc(d.expBar.exp)}"><div class="fl" style="width:${Math.round(((d.expBar.exp - d.expBar.min) / Math.max(1, d.expBar.next - d.expBar.min)) * 100)}%"></div><div class="cap"><span class="lb">EXP</span><span class="nn">${esc(d.expBar.exp)}/${esc(d.expBar.next)}</span></div></div>` : ''}
        <div class="bk-coin" title="钱包">${esc(val(c.gp))}gp · ${esc(val(c.sp))}sp · ${esc(val(c.cp))}cp</div>
      </div>
      <button class="bk-x" title="合上册子">✕</button>
    </div>`

  const left = c.role === 'pc' || d.skills ? `
      ${sec(asi.capAdd || '六维', radarSvg(c, d) + (asi.zone || ''))}
      ${sec('豁免', `<div class="bk-saves">${(d.saves ?? []).map(s2 => `<span class="bk-sv prof">${esc(ATTRS.find(a => a[1] === s2.key)?.[0] ?? s2.key)} ${sign(s2.mod)}</span>`).join('') || '<span class="bk-sv" style="opacity:.55">无熟练豁免</span>'}</div>`)}
      ${sec('技能', `<div class="bk-skills">${(d.skills ?? []).map(s2 => `
        <div class="bk-sk prof"><span class="dot"></span><span class="nm2">${esc(SKILL_CN[s2.key] ?? s2.key)}</span><span class="attr-tag">${esc((ATTRS.find(a => a[1] === s2.attr)?.[0] ?? s2.attr).toUpperCase())}</span><span class="md2">${sign(s2.mod)}</span></div>`).join('') || '<div class="bk-sk"><span class="nm2" style="opacity:.55">无熟练技能</span></div>'}</div>`)}` : ''

  const vital = sec('速览', `<div class="bk-chips">
      ${chip('AC', acOf(c))}${c.speed != null ? chip('速度', c.speed + '尺') : ''}
      ${c.darkvision ? chip('暗视', c.darkvision + '尺') : ''}${chip('被动察觉', d.passive ?? '???')}
      ${c.temp_hp > 0 ? chip('临时HP', '+' + c.temp_hp) : ''}
      ${c.exhaustion > 0 ? chip('力竭', c.exhaustion + '级') : ''}
      ${(c.hd_available != null && c.level != null) ? chip('治愈骰', c.hd_available + '/' + c.level) : ''}
    </div>`)
  const sts = c.statuses ?? []
  const stHtml = sts.length ? `
      <div class="bk-sec" style="margin-top:8px">
        <div class="bk-st">${sts.map(s2 => `<span class="stc ${esc(s2.kind ?? 'i')}"><span class="k">${esc(s2.name)}</span>${esc(s2.remaining ?? '')}</span>`).join('')}</div>
        <div class="bk-stnotes">${sts.filter(s2 => s2.effect).map(s2 => `<p>${esc(s2.name)}：${esc(s2.effect)}</p>`).join('')}</div>
      </div>` : ''
  const castHtml = (d.slotsLv ?? []).length ? sec(pick.capAdd || '施法', `
        <div class="bk-cast-top">
          ${chip('主属性', ({ wis: '感知', cha: '魅力', int: '智力' })[c.caster_attr] ?? c.caster_attr ?? '—')}${chip('法术DC', d.dc ?? '—')}${chip('法术攻击', sign(d.atk ?? 0))}
        </div>
        <div class="bk-slots">${d.slotsLv.map(s2 => `<div class="bk-slot"><span class="lv">${s2.lv}环</span><span class="pips">${Array.from({ length: s2.total }, (_, i) => `<span class="pip ${i < s2.now ? '' : 'used'}"></span>`).join('')}</span></div>`).join('')}</div>
        <div class="bk-spells">
          ${(c.spells_known ?? []).length ? `<div class="bk-sp-row"><span class="lv">已知</span><span class="nms">${esc(c.spells_known.join(' · '))}</span></div>` : ''}
          ${(c.spells_prepared ?? []).length ? `<div class="bk-sp-row"><span class="lv">已备</span><span class="nms">${esc(c.spells_prepared.join(' · '))}</span></div>` : ''}
        </div>${pick.zone || ''}`) : (pick.zone ? sec(pick.capAdd, `<div class="bk-spells">${pick.zone}</div>`) : '')
  const eqHtml = sec('装备', `
        <div class="bk-rows">
          ${(c.weapons ?? []).map(w => `<div class="bk-row"><span class="a">${esc(WEAPON_CN[w.name] ?? w.name)} <span class="dv">${esc(w.damage)} ${esc(DMG_CN[w.damage_type] ?? w.damage_type ?? '')}${w.props?.length ? ' · ' + w.props.map(p => esc(PROP_CN[p] ?? p)).join('·') : ''}</span></span></div>`).join('')}
          ${c.armor ? `<div class="bk-row"><span class="a">${esc(ARMOR_CN[c.armor] ?? c.armor)}</span><span class="b">AC ${esc(acOf(c))}</span></div>` : ''}
          ${c.shield ? `<div class="bk-row"><span class="a">盾牌</span><span class="b">+2 AC</span></div>` : ''}
        </div>
        <div class="bk-sec" style="margin-top:8px">
          <div class="bk-cap">背包</div>
          <div class="bk-rows bk-note-rows">${(c.gear ?? []).map(t => `<div class="bk-row"><span class="a">${esc(t)}</span></div>`).join('')}</div>
        </div>`)
  const ftHtml = (c.features ?? []).length ? sec('特征', `
        <div class="bk-rows bk-note-rows">
          ${c.features.map(f => { const seg = String(f).split('|'); const right = [seg[1], seg[2]].filter(Boolean).join(' · '); return `<div class="bk-row"><span class="a">${esc(seg[0])}</span>${right ? `<span class="b">${esc(right)}</span>` : ''}</div>` }).join('')}
        </div>`) : ''
  const groups = [
    (c.armor_prof ?? []).length ? ['护甲', c.armor_prof] : null,
    (c.weapon_prof ?? []).length ? ['武器', c.weapon_prof] : null,
    (c.tool_prof ?? []).length ? ['工具', c.tool_prof] : null,
    (c.languages ?? []).length ? ['语言', c.languages] : null,
  ].filter(Boolean)
  const profHtml = groups.length ? sec('训练与语言', `
        <div class="bk-prof-groups">${groups.map(([lb, items]) => `<div class="bk-pg"><span class="gl">${esc(lb)}</span><span class="gs">${items.map(x => `<span>${esc(x)}</span>`).join('')}</span></div>`).join('')}</div>`) : ''
  const defHtml = ((c.resist ?? []).length || (c.immune ?? []).length) ? `
      <div class="bk-sec" style="margin-top:8px">
        <div class="bk-chips">
          ${(c.resist ?? []).map(r => chip('抗', r)).join('')}
          ${(c.immune ?? []).map(r => chip('免', r)).join('')}
        </div>
      </div>` : ''
  const isPC = c.role === 'pc'
  const bio = (c.biography ?? [])
    .map(b => String(b).replace(/^·\s*/, ''))
    .filter(b => isPC || !b.startsWith('[秘]'))
    .map(b => b.replace(/^\[秘\]\s*/, ''))
    .filter(Boolean)
  const taleHtml = bio.length || c.description || c.persona ? `
      <div class="bk-sec bk-tale">
        <div class="bk-cap">小传</div>
        ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
        ${c.persona ? `<div class="bk-perso">
          <span class="pl">性格</span><span class="pv">${esc(c.persona.personality ?? '')}</span>
          <span class="pl">理想</span><span class="pv">${esc(c.persona.ideals ?? '')}</span>
          <span class="pl">羁绊</span><span class="pv">${esc(c.persona.bonds ?? '')}</span>
          <span class="pl">缺陷</span><span class="pv">${esc(c.persona.flaws ?? '')}</span>
        </div>` : ''}
        ${bio.length ? `<div class="bk-mems"><div class="mt">追忆</div>${bio.map(m => `<p>${esc(m)}</p>`).join('')}</div>` : ''}
      </div>` : ''
  const CHROME = `<div class="bk-fade"></div><div class="bk-arrow"><svg width="18" height="10" viewBox="0 0 18 10"><path d="M2 2l7 6 7-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
  return `${head}<div class="bk-body">
      ${taleHtml}
      <div class="bk-cols">
        <div>${left}</div>
        <div>${vital}${stHtml}${castHtml}${eqHtml}${ftHtml}${profHtml}${defHtml}</div>
      </div>
    </div>${CHROME}`
}

const sec = (t, inner) => `<div class="bk-sec"><div class="bk-cap">${t}</div>${inner}</div>`   // t 可含 gdot/进度（信任内部拼装,非用户数据）
const chip = (k, v) => `<span class="bk-chip"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span>`
function acOf(c) {
  const dexM = mod(c.dex ?? 10)
  const FM = { scale_mail: { base: 14, cap: 2 }, chain_mail: { base: 16, cap: 0 } }
  let ac = 10 + dexM
  if (c.armor && FM[c.armor]) ac = FM[c.armor].base + Math.min(dexM, FM[c.armor].cap)
  if (c.shield) ac += 2
  return ac
}

/* ═════ 挂载/交互（原型本地；交付版=runtime 泵+acts 委托）═════ */
const GROW = { asi: {}, spells: [] }   // 选择态（交付版落档后由泵 refresh 回落现值）

const hudEl = document.getElementById('hud-left')
const bookEl = document.getElementById('book')
let activeWho = null

function renderHud() {
  const p = { ...DATA.player, derived: derive(DATA.player) }
  const mates = DATA.mates.map(c => ({ ...c, derived: derive(c) }))
  hudEl.innerHTML = `<div class="hero">${heroCard(p, {})}</div>
    <div class="mates"><div class="m-zone">同伴</div>${mates.map(mateCard).join('')}</div>`
}
function mateCard(c) {
  const g = genderOf(c)
  const d = c.derived ?? {}
  const unk = d.hpPct == null
  const hpP = unk ? 100 : d.hpPct
  const dying = !unk && (c.hp ?? 1) <= 0
  return `<div class="m-card ${dying ? 'dying' : ''}" data-who="${esc(c._who)}">
    <div class="m-av ${g.cls}">${avatarFor(c)}<span class="m-lv">LV${esc(c.level ?? '???')}</span></div>
    <div class="m-main">
      <div class="m-top"><span class="m-nm">${esc(c.name ?? '')}</span>${g.glyph ? `<span class="m-gd ${g.cls}">${g.glyph}</span>` : ''}</div>
      <div class="m-hp"><span class="tk"><span class="fl" style="width:${hpP}%"></span></span><span class="nn">${esc(hpText(c))}</span></div>
      ${(c.statuses ?? []).length ? `<div class="m-status">${chipsSmall(c.statuses)}</div>` : ''}
    </div>
  </div>`
}

function positionBook(anchor) {
  if (!anchor?.isConnected) return
  const r = anchor.getBoundingClientRect()
  const w = bookEl.offsetWidth, h = bookEl.offsetHeight
  let left = r.right + 12
  if (left + w > window.innerWidth - 12) left = Math.max(12, r.left - w - 12)
  bookEl.style.left = left + 'px'
  bookEl.style.top = Math.min(Math.max(r.top - 6, 12), Math.max(12, window.innerHeight - h - 14)) + 'px'
}
function openBook(who, anchor) {
  activeWho = who
  if (who !== 'player') { GROW.asi = {}; GROW.spells = [] }
  reflowBook(anchor)
}
function reflowBook() {
  const anchor = hudEl.querySelector(`[data-who="${CSS.escape(activeWho ?? '')}"]`)
  const old = bookEl.querySelector('.bk-body')
  const st = old ? old.scrollTop : 0
  const cBase = activeWho === 'player' ? DATA.player : DATA.mates.find(x => x._who === activeWho)
  const c = { ...cBase }
  for (const [k, n] of Object.entries(GROW.asi)) if (n) c[k] = (c[k] ?? 10) + n   // 预览并入
  c.derived = derive(c, GROW.asi)
  bookEl.innerHTML = bookHtml(c, cBase)
  bookEl.classList.add('open')
  positionBook(anchor)
  const nb = bookEl.querySelector('.bk-body')
  nb.scrollTop = st
  const check = () => bookEl.classList.toggle('s-fly', nb.scrollHeight - nb.scrollTop > nb.clientHeight + 4)
  nb.addEventListener('scroll', check)
  requestAnimationFrame(check)
}
function closeBook() { bookEl.classList.remove('open'); activeWho = null }

renderHud()

hudEl.addEventListener('click', e => {
  const card = e.target.closest('[data-who]')
  if (!card) return
  const who = card.dataset.who
  if (activeWho === who && bookEl.classList.contains('open')) { closeBook(); return }
  openBook(who, card)
})

bookEl.addEventListener('click', e => {
  if (e.target.closest('.bk-x') || e.target.closest('.bk-fade')) { closeBook(); return }
  const att = e.target.closest('.g-att')
  if (att) {
    const k = att.dataset.stat
    const cur = GROW.asi[k] ?? 0
    const sel = Object.values(GROW.asi).reduce((a, b) => a + b, 0)
    if (cur === 2) GROW.asi[k] = 0
    else if (sel >= 2) return
    else GROW.asi[k] = cur + 1
    reflowBook(); return
  }
  if (e.target.closest('[data-clear="asi"]')) { GROW.asi = {}; reflowBook(); return }
  const row = e.target.closest('.gp-row')
  if (row) {
    const n = row.dataset.spell
    const i = GROW.spells.indexOf(n)
    if (i >= 0) GROW.spells.splice(i, 1)
    else if (GROW.spells.length < 2) GROW.spells.push(n)
    reflowBook(); return
  }
  const sub = e.target.closest('.g-btn')
  if (!sub) return
  if (sub.dataset.op === 'asi') {
    if (Object.values(GROW.asi).reduce((a, b) => a + b, 0) !== 2) return   // 交付版=front_commit 恰2校验,此处前挡
    for (const [k, n] of Object.entries(GROW.asi)) DATA.player[k] = Math.min(20, (DATA.player[k] ?? 10) + n)
    DATA.player.pending = DATA.player.pending.filter(x => !String(x).includes('ASI'))
    GROW.asi = {}
  } else if (sub.dataset.op === 'spells') {
    if (GROW.spells.length !== 2) return
    DATA.player.spells_known.push(...GROW.spells)   // 交付版写英文名并提示可 prep
    DATA.player.pending = DATA.player.pending.filter(x => !String(x).includes('新法术'))
    GROW.spells = []
  }
  renderHud()          // 主卡待办 chip 档数刷新
  reflowBook()   // 余档自动续；无档则两节回归现状
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBook() })
document.addEventListener('click', e => { if (!bookEl.contains(e.target) && !e.target.closest('[data-who]')) closeBook() })
</script>
</body>
</html>
