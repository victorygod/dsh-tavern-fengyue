const sign = v => (v >= 0 ? '+' : '−') + Math.abs(v)
const mod = v => Math.floor((v - 10) / 2)
const pb = lv => 2 + Math.floor((Math.min(Math.max(lv, 1), 20) - 1) / 4)

function derive(c, growASI = {}) {
  const lv = Math.min(Math.max(c.level ?? 1, 1), 20), P = pb(lv)
  const dv = k => (c[k] ?? null)
  const attrMods = ATTRS.map(([, key]) => { const v = dv(key); return { key, mod: v == null ? null : mod(v) + (growASI[key] || 0) } })
  const skills = SKILLS18.map(([lb, key, attr]) => {
    const exp = (c.expertise ?? []).includes(key), prof = exp || (c.skill_prof ?? []).includes(key)
    return { key, lb, attr, prof, exp, mod: prof ? mod(dv(attr) ?? 10) + (exp ? P * 2 : P) : mod(dv(attr) ?? 10) }
  })
  const saves = ATTRS.map(([, key]) => {
    const prof = (c.save_prof ?? []).includes(key)
    return { key, prof, mod: mod(dv(key) ?? 10) + (prof ? P : 0) }

  return {

    expBar: c.exp != null ? { exp: c.exp, min: c.expMin, next: c.expNext } : null,
  }
}

/* 头像：图槽真图 138% 放大内裁（缘可被框沿吃掉、不溢出圆外）;槽缺/404→名字首字 */
function avatarFor(c) {
  const key = `${String(c.race ?? '').replace(/_/g, '-')}-${c.gender === 'male' ? 'male' : c.gender === 'female' ? 'female' : 'unknown'}`
  const letter = `<span class="pix-letter" style="font-size:${c._who === 'player' ? '24px' : '18px'}">${esc((c.name ?? '?')[0] ?? '?')}</span>`
  return letter + `<span class="av-clip"><img class="av-img" src="../preset/ui/avatars/${esc(key)}.webp" alt="" onerror="this.parentNode.remove()"></span>`
}
const genderOf = c => GENDER_META[c.gender] ?? GENDER_META.unknown
const hpText = c => `${val(c.hp)}${c.temp_hp > 0 ? '+' + c.temp_hp : ''}/${val(c.hp_max)}`
function acOf(c) {
  const dexM = mod(c.dex ?? 10)
  const FM = { scale_mail: { base: 14, cap: 2 }, chain_mail: { base: 16, cap: 0 } }
  let ac = 10 + dexM
  if (c.armor && FM[c.armor]) ac = FM[c.armor].base + Math.min(dexM, FM[c.armor].cap)
  if (c.shield) ac += 2
  return ac
}

const sec = (t, inner, tip) => `<div class="bk-sec"><div class="bk-cap"${tip ? ` data-tip="${esc(tip)}"` : ''}>${t}</div>${inner}</div>`
/* 成长节：标题栏呼吸底（click 弹出学习框）+ 中文 tip 锚 */
function secG(title, pend, open, kind, inner, tip) {
  const cap = pend
    ? `<div class="bk-cap g-pend ${open ? 'on' : ''}" data-grow="${kind}" data-tip="${esc(tip ?? '')}（有待分配——点开分配对话框，册保持在后）">${title}<span class="g-wait">有待分配</span></div>`
    : `<div class="bk-cap"${tip ? ` data-tip="${esc(tip)}"` : ''}>${title}</div>`
  return `<div class="bk-sec">${cap}${inner}</div>`
}
const chip = (k, v) => `<span class="bk-chip"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span>`

/* ── 雷达（照 view.mjs；值=预览并入后） ── */
function radarSvg(c, d) {
  const CX = 100, CY = 95, RR = 66
  const a = i => -Math.PI / 2 + i * Math.PI / 3
  const pt = (i, r) => [CX + r * Math.cos(a(i)), CY + r * Math.sin(a(i))]
  const ring = fr => ATTRS.map((_, i) => { const [x, y] = pt(i, RR * fr); return `${x.toFixed(1)},${y.toFixed(1)}` }).join(' ')
  const poly = ATTRS.map(([, key]) => {
    const i = ATTRS.findIndex(x => x[1] === key)
    const m = (d?.attrMods ?? []).find(x => x.key === key)?.mod
    const t = m == null ? null : Math.max(0, Math.min(1, (m + 5) / 10))
    const [x, y] = pt(i, t == null ? 0 : RR * (0.25 + 0.75 * t))
    return `${x.toFixed(1)},${y.toFixed(1)}`
  }).join(' ')
  const labels = ATTRS.map(([lb, key], i) => {
    const drop = i === 3 ? -5 : 4
    const [x, y0] = pt(i, RR + 17)
    const y = y0 + drop
    const anchor = Math.abs(x - CX) < 8 ? 'middle' : x < CX ? 'end' : 'start'
    const m = (d?.attrMods ?? []).find(x2 => x2.key === key)?.mod
    return `<text class="rl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${lb}</text>`
      + `<text x="${x.toFixed(1)}" y="${(y + 15).toFixed(1)}" text-anchor="${anchor}"><tspan class="rv">${esc(c[key] ?? '???')}</tspan><tspan class="rm">${m == null ? '' : ' ' + sign(m)}</tspan></text>`
  }).join('')
  return `<svg class="bk-radar" viewBox="0 0 200 190" role="img" aria-label="六维属性">`
    + [1 / 3, 2 / 3, 1].map(fr => `<polygon class="ring" points="${ring(fr)}"/>`).join('')
    + ATTRS.map((_, i) => { const [x, y] = pt(i, RR); return `<line class="axis" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>` }).join('')
    + `<polygon class="poly" points="${poly}"/>` + labels + `</svg>`
}

        <div class="bk-sec" style="margin-top:8px">
          <div class="bk-cap" data-tip="背包——零碎持有(杂物/消耗品),随叙事增减">Gear</div>
          <div class="bk-rows bk-note-rows">${(c.gear ?? []).map(t => `<div class="bk-row"><span class="a">${esc(t)}</span></div>`).join('') || none()}</div>
        </div>`, '装备——已持有实装的武器/护甲/盾牌(会用什么见 Proficiencies)')
  const ftHtml = sec('Features', `<div class="bk-rows bk-note-rows">
        ${(c.features ?? []).map(f => { const seg = String(f).split('|'); const right = [seg[1], seg[2]].filter(Boolean).join(' · '); return `<div class="bk-row"><span class="a">${esc(seg[0])}</span>${right ? `<span class="b">${esc(right)}</span>` : ''}</div>` }).join('') || none()}
      </div>`, '特征——职业能力(名｜说明｜回充时机｜已用),池类资源随长休/短休回充')
  const defHtml = sec('Resistances / Immunities', `<div class="bk-chips">
        ${(c.resist ?? []).map(r => chip('抗', r)).join('')}${(c.immune ?? []).map(r => chip('免', r)).join('')}
        ${((c.resist ?? []).length + (c.immune ?? []).length) === 0 ? none() : ''}
      </div>`, '抗性=伤害减半;免疫=伤害为零')
  const bio = (c.biography ?? [])
    .map(b => String(b).replace(/^·\s*/, ''))
    .filter(b => c.role === 'pc' || !b.startsWith('[秘]'))
    .map(b => b.replace(/^\[秘\]\s*/, ''))
    .filter(Boolean)
  const taleHtml = `
      <div class="bk-sec bk-tale">
        <div class="bk-cap">小传</div>
        ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
        ${c.persona ? `<div class="bk-perso">
          <span class="pl">性格</span><span class="pv">${esc(c.persona.personality ?? '')}</span>
          <span class="pl">理想</span><span class="pv">${esc(c.persona.ideals ?? '')}</span>
          <span class="pl">羁绊</span><span class="pv">${esc(c.persona.bonds ?? '')}</span>
          <span class="pl">缺陷</span><span class="pv">${esc(c.persona.flaws ?? '')}</span>
        </div>` : ''}
        ${bio.length ? `<div class="bk-mems"><div class="mt">追忆</div>${bio.map(m => `<p>${esc(m)}</p>`).join('')}</div>` : ''}
      </div>`
  const CHROME = `<div class="bk-fade"></div><div class="bk-arrow"><svg width="18" height="10" viewBox="0 0 18 10"><path d="M2 2l7 6 7-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
  return `${head}<div class="bk-body">
      ${taleHtml}
      <div class="bk-cols">
        <div>${left}</div>
        <div>${cast}${stHtml}${eqHtml}${ftHtml}${defHtml}</div>
      </div>
    </div>${CHROME}`
}

/* 施法三行：戏法（level 0）/已知（环术）/已备——空行「无」 */
function spRows(c) {
  const con = (c.spells_known ?? []).filter(n => CANTRIPS.includes(n))
  const lvl = (c.spells_known ?? []).filter(n => !CANTRIPS.includes(n))
  const row = (lb, arr) => `<div class="bk-sp-row"><span class="lv">${lb}</span><span class="nms">${(arr ?? []).length ? esc(arr.join(' · ')) : none()}</span></div>`
  const isCaster = c.caster_attr != null
  return isCaster ? `<div class="bk-spells">${row('戏法', con)}${row('已知', lvl)}${row('已备', c.spells_prepared)}</div>` : ''
}
const hasKind = (c, kind) => (c?.pending ?? []).some(x => String(x).includes(kind))

/* ── 主角卡（待办 chip=呼吸非按钮） ── */
function heroCard(p, avatars) {
  const g = genderOf(p)
  const d = p.derived ?? {}
  const unk = d.hpPct == null
  const hpP = unk ? 100 : d.hpPct
  const tw = (p.temp_hp && p.hp_max) ? Math.min((p.temp_hp / p.hp_max) * 100, 100 - hpP) : 0
  const xb = d.expBar
  return `
    <div class="h-card" data-who="player">
      <div class="row1">
        <div class="h-av ${g.cls}">${avatarFor(p)}<span class="h-lv">LV${esc(p.level ?? '???')}</span></div>
        <div class="h-names">
          <div class="h-nm">${esc(p.name ?? '')}</div>
          <div class="h-tags">
            <span class="h-tag">${esc(RACE_CN[p.race] ?? p.race ?? '')}</span>
            ${g.glyph ? `<span class="g-glyph ${g.cls}">${g.glyph}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="h-hp">
        <div class="hpbar" data-tip="HP ${esc(hpText(p))}">
          <div class="fill" style="width:${hpP}%"></div>
          ${tw ? `<div class="tmp" style="width:${tw}%; left:${hpP}%"></div>` : ''}
          <div class="cap"><span class="lb">HP</span><span class="nn">${esc(hpText(p))}</span></div>
        </div>
      </div>
      ${xb ? `<div class="h-exp" data-tip="EXP ${esc(xb.exp)} / 升至 LV${esc((p.level ?? 0) + 1)} 需 ${esc(xb.next)}"><div class="bar"><div class="fill" style="width:${Math.round(((xb.exp - xb.min) / Math.max(1, xb.next - xb.min)) * 100)}%"></div></div><span class="lb">EXP ${esc(xb.exp)}/${esc(xb.next)}</span></div>` : ''}
      <div class="h-status">${chipsSmall(p.statuses)}${(p.pending ?? []).length ? `<span class="stc i pending" data-tip="存在未分配的成长项（属性点/新法术）——点卡打开数据册，进对应节分配"><span class="k">◆</span>未分配成长${(p.pending ?? []).length > 1 ? '·' + p.pending.length : ''}</span>` : ''}</div>
    </div>`
}
function mateCard(c) {
  const g = genderOf(c)
  const d = c.derived ?? {}
  const unk = d.hpPct == null
  const hpP = unk ? 100 : d.hpPct
  const dying = !unk && (c.hp ?? 1) <= 0
  return `<div class="m-card ${dying ? 'dying' : ''}" data-who="${esc(c._who)}">
    <div class="m-av ${g.cls}">${avatarFor(c)}<span class="m-lv">LV${esc(c.level ?? '???')}</span></div>
    <div class="m-main">
      <div class="m-top"><span class="m-nm">${esc(c.name ?? '')}</span>${g.glyph ? `<span class="m-gd ${g.cls}">${g.glyph}</span>` : ''}</div>
      <div class="m-hp"><span class="tk"><span class="fl" style="width:${hpP}%"></span></span><span class="nn">${esc(hpText(c))}</span></div>
      ${(c.statuses ?? []).length ? `<div class="m-status">${chipsSmall(c.statuses)}</div>` : ''}
    </div>
  </div>`
}

/* ═════ 挂载/交互（原型本地；交付=runtime 泵 + acts 委托 + front_commit）═════ */
const GROW = { asi: {}, spells: [], open: null }   // open=asi|spells|null（学习页展开态；未保存选择对应键保留）
const hudEl = document.getElementById('hud-left')
const bookEl = document.getElementById('book')
let activeWho = null

function renderHud() {
  const p = { ...DATA.player, derived: derive(DATA.player) }
  const mates = DATA.mates.map(c => ({ ...c, derived: derive(c) }))
  hudEl.innerHTML = `<div class="hero">${heroCard(p, {})}</div>
    <div class="mates"><div class="m-zone">同伴</div>${mates.map(mateCard).join('')}</div>`
}
function positionBook(anchor) {
  if (!anchor?.isConnected) return
  const r = anchor.getBoundingClientRect()
  const w = bookEl.offsetWidth, h = bookEl.offsetHeight
  let left = r.right + 12
  if (left + w > window.innerWidth - 12) left = Math.max(12, r.left - w - 12)
  bookEl.style.left = left + 'px'
  bookEl.style.top = Math.min(Math.max(r.top - 6, 12), Math.max(12, window.innerHeight - h - 14)) + 'px'
}
function openBook(who) {
  activeWho = who
  if (who !== 'player') hideDlg()   // 换人=弃选择收框
  reflowBook()
}
function reflowBook() {
  const anchor = hudEl.querySelector(`[data-who="${CSS.escape(activeWho ?? '')}"]`)
  const old = bookEl.querySelector('.bk-body')
  const st = old ? old.scrollTop : 0
  const cBase = activeWho === 'player' ? DATA.player : DATA.mates.find(x => x._who === activeWho)
  const c = { ...cBase }
  for (const [k, n] of Object.entries(GROW.asi)) if (n) c[k] = (c[k] ?? 10) + n   // 未保存加点并入预览
  c.derived = derive(c, GROW.asi)
  bookEl.innerHTML = bookHtml(c, cBase)
  bookEl.classList.add('open')
  positionBook(anchor)
  const nb = bookEl.querySelector('.bk-body')
  nb.scrollTop = st
  const check = () => bookEl.classList.toggle('s-fly', nb.scrollHeight - nb.scrollTop > nb.clientHeight + 4)
  nb.addEventListener('scroll', check)
  requestAnimationFrame(check)
}
function closeBook() { bookEl.classList.remove('open'); activeWho = null; hideDlg() }

renderHud()

hudEl.addEventListener('click', e => {
  const card = e.target.closest('[data-who]')
  if (!card) return
  const who = card.dataset.who
  if (activeWho === who && bookEl.classList.contains('open')) { closeBook(); return }
  openBook(who)
})

/* 避坑（沿实现层同源陷阱）：册内点击若触发重渲染，e.target 随 innerHTML 重挂而脱挂——
   冒泡到 document 的「点外侧关册」判定 contains(脱挂节点)=false,会误关册。同拍旗标放行。
   同型陷阱在对话框:框内点击重渲染后 closest('.g-dlg') 同样落空——inDlgClick 同拍放行。 */
let inBookClick = false
let inDlgClick = false
/* ── 学习对话框（点呼吸标题栏弹出——浮于册上、册不关；保存=直接生效；取消/外侧/Esc=放弃选择）── */
const dlgEl = document.createElement('div')
dlgEl.className = 'g-dlg dnd-hud'   // body 直挂不进面板容器——token 自携(.dnd-hud 作用域),否则 var(--p1) 空解析=透明底
document.body?.appendChild?.(dlgEl)
function hideDlg() { GROW.open = null; GROW.asi = {}; GROW.spells = []; dlgEl.classList.remove('open') }
function openDlg(kind) {
  if (GROW.open && GROW.open !== kind) { if (GROW.open === 'asi') GROW.asi = {}; else GROW.spells = [] }   // 换节即弃旧选
  GROW.open = kind
  reflowBook()
  renderDlg()
}
function renderDlg() {
  dlgEl.innerHTML = GROW.open === 'asi' ? asiPanel(DATA.player) : GROW.open === 'spells' ? spellPanel(DATA.player) : ''
  dlgEl.classList.add('open')
  positionDlg()
}
function positionDlg() {
  const w = dlgEl.offsetWidth, h = dlgEl.offsetHeight   // 居中定位(视口)
  dlgEl.style.left = Math.max(12, Math.round((window.innerWidth - w) / 2)) + 'px'
  dlgEl.style.top = Math.max(12, Math.round((window.innerHeight - h) / 2)) + 'px'
}
function cancelDlg() {
  GROW.open = null; GROW.asi = {}; GROW.spells = []
  dlgEl.classList.remove('open')
  reflowBook()   // 标题栏 on 态还原
}
/* 保存=直接生效（交付版走 front_commit 后泵 refresh 回落现值；余档自动续开） */
function saveDlg(kind) {
  if (kind === 'asi') {
    if (Object.values(GROW.asi).reduce((a, b) => a + b, 0) !== 2) return
    for (const [k, n] of Object.entries(GROW.asi)) DATA.player[k] = Math.min(20, (DATA.player[k] ?? 10) + n)
    DATA.player.pending = DATA.player.pending.filter(x => !String(x).includes('ASI'))
    GROW.asi = {}
    renderHud(); GROW.open = null; dlgEl.classList.remove('open')
    reflowBook()
    if (hasKind(DATA.player, 'ASI')) requestAnimationFrame(() => openDlg('asi'))   // 余档自动续开
  } else if (kind === 'spells') {
    if (GROW.spells.length !== 2) return
    DATA.player.spells_known.push(...GROW.spells)   // 交付版写英文名
    DATA.player.pending = DATA.player.pending.filter(x => !String(x).includes('新法术'))
    GROW.spells = []
    renderHud(); GROW.open = null; dlgEl.classList.remove('open')
    reflowBook()
    if (hasKind(DATA.player, '新法术')) requestAnimationFrame(() => openDlg('spells'))
  }
}
dlgEl.addEventListener('click', e => {
  inDlgClick = true
  const inc = e.target.closest('[data-inc]')
  if (inc) {
    const k = inc.dataset.inc
    const n = GROW.asi[k] ?? 0
    const sel = Object.values(GROW.asi).reduce((a, b) => a + b, 0)
    if (sel >= 2 || n >= 2) return
    GROW.asi[k] = n + 1
    renderDlg(); reflowBook(); positionDlg(); return
  }
  const dec = e.target.closest('[data-dec]')
  if (dec) {
    const k = dec.dataset.dec
    const n = GROW.asi[k] ?? 0
    if (!n) return
    GROW.asi[k] = n - 1
    renderDlg(); reflowBook(); positionDlg(); return
  }
  if (e.target.closest('[data-clear="asi"]')) { GROW.asi = {}; renderDlg(); reflowBook(); positionDlg(); return }
  const row = e.target.closest('.gp-row')
  if (row) {
    const n = row.dataset.spell
    const i = GROW.spells.indexOf(n)
    if (i >= 0) GROW.spells.splice(i, 1)
    else if (GROW.spells.length < 2) GROW.spells.push(n)
    renderDlg(); reflowBook(); positionDlg(); return
  }
  const close = e.target.closest('[data-growclose]')
  if (close) { cancelDlg(); return }
  const save = e.target.closest('[data-growsave]')
  if (save) saveDlg(save.dataset.growsave)
})

bookEl.addEventListener('click', e => {
  inBookClick = true
  if (e.target.closest('.bk-x') || e.target.closest('.bk-fade')) { closeBook(); return }
  const cap = e.target.closest('[data-grow]')
  if (cap) { openDlg(cap.dataset.grow); return }   // 弹出学习对话框（册保持在后）
})
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (GROW.open) cancelDlg(); else closeBook()
})
document.addEventListener('click', e => {
  const wasBook = inBookClick; inBookClick = false
  const wasDlg = inDlgClick; inDlgClick = false         // 框内点击若重渲染,closest('.g-dlg') 会落空——旗标先于一切判定
  if (GROW.open) {
    if (wasDlg) return                                   // 同拍:框内点击(重渲染脱挂)——不取消
    if (e.target.closest?.('.g-dlg')) return             // 框内自理(未重渲染路径)
    if (e.target.closest?.('[data-grow]')) return       // 换节已由 book 处理器同拍完成
    cancelDlg()                                          // 外侧=取消对话框，册不动
    return
  }
  if (wasBook || wasDlg) return                           // 同拍:内部点击不算外侧（保存后框已收,别顺手关册）
  if (!bookEl.contains(e.target) && !e.target.closest('[data-who]')) closeBook()
})

/* ── 悬停浮签：data-tip 统一 0.1s 延迟出、移开/滚动即收（原生 title 延迟约 1s 且不可控，弃用） ── */
const tipEl = document.createElement('div')
tipEl.id = 'vtip'
tipEl.className = 'dnd-hud'
document.body?.appendChild?.(tipEl)
let tipTimer = null, tipHost = null
function hideTip() { clearTimeout(tipTimer); tipTimer = null; tipHost = null; tipEl.classList.remove('open') }
function showTip(el) {
  tipHost = el
  tipTimer = setTimeout(() => {
    tipEl.textContent = el.getAttribute('data-tip') ?? ''
    tipEl.classList.add('open')
    const r = el.getBoundingClientRect()
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight
    const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8))
    let top = r.bottom + 6
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6)
    tipEl.style.left = left + 'px'
    tipEl.style.top = top + 'px'
  }, 100)   // 统一 0.1s
}
document.addEventListener('mouseover', e => {
  const el = e.target?.closest?.('[data-tip]') ?? null
  if (el === tipHost) return
  hideTip()
  if (el) showTip(el)
})
document.addEventListener('scroll', hideTip, true)   // 滚动/重挂后旧定位失效——先行收起
</script>
</body>
</html>
